plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'expo.modules.senswavegrpc'
version = '0.1.0'

android {
    namespace "expo.modules.senswavegrpc"
    defaultConfig {
        versionCode 1
        versionName "0.1.0"
        consumerProguardFiles 'consumer-rules.pro'
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Raw ClientCall API only: no grpc-stub, no protobuf runtime. JS owns (de)serialization.
    implementation "io.grpc:grpc-okhttp:1.73.0"
}
